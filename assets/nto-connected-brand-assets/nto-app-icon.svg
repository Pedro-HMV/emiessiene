<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NTO app icon</title>
  <desc id="desc">Dois elos pixelados interligados, simbolizando amizades e conexões.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fafdfe"/>
      <stop offset=".48" stop-color="#edf6fb"/>
      <stop offset="1" stop-color="#bfd7e7"/>
    </linearGradient>
    <linearGradient id="linkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc2d8"/>
      <stop offset=".45" stop-color="#568dac"/>
      <stop offset="1" stop-color="#1676bd"/>
    </linearGradient>
    <linearGradient id="linkDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#568dac"/>
      <stop offset=".55" stop-color="#1676bd"/>
      <stop offset="1" stop-color="#0c5f9d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#315e78" flood-opacity=".22"/>
    </filter>
    <path id="pixelLink" fill-rule="evenodd" d="
      M 112,56 H 226 V 76 H 246 V 190 H 226 V 210 H 112 V 190 H 92 V 76 H 112 Z
      M 132,96 H 206 V 116 H 226 V 170 H 206 V 190 H 132 V 170 H 112 V 116 H 132 Z"/>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="url(#tile)" stroke="#568dac" stroke-width="8"/>
  <rect x="23" y="23" width="466" height="466" rx="85" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="3"/>
  <g filter="url(#shadow)" transform="translate(8 8) scale(1.04)">
    <g transform="translate(20 65) rotate(-38 205 220)">
      <use href="#pixelLink" fill="url(#linkDeep)" stroke="#0c5f9d" stroke-width="4" stroke-linejoin="miter"/>
      <path d="M112 59 H224 V78 H244 V91 H112 Z" fill="url(#gloss)" opacity=".58"/>
    </g>
    <g transform="translate(125 64) rotate(-38 205 220)">
      <use href="#pixelLink" fill="url(#linkBlue)" stroke="#315e78" stroke-width="4" stroke-linejoin="miter"/>
      <path d="M112 59 H224 V78 H244 V91 H112 Z" fill="url(#gloss)" opacity=".72"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="384" y="102" width="24" height="24" rx="3" fill="#9fc2d8"/>
    <rect x="414" y="132" width="17" height="17" rx="2" fill="#568dac"/>
    <rect x="383" y="156" width="12" height="12" rx="1.5" fill="#1676bd"/>
  </g>
</svg>
