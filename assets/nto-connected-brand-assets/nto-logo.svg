<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480" role="img" aria-labelledby="title desc">
  <title id="title">NTO — Nostalgic Talk Online</title>
  <desc id="desc">Dois elos pixelados interligados ao lado do nome NTO.</desc>
  <defs>
    <linearGradient id="linkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc2d8"/>
      <stop offset="0.45" stop-color="#568dac"/>
      <stop offset="1" stop-color="#1676bd"/>
    </linearGradient>
    <linearGradient id="linkDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#568dac"/>
      <stop offset="0.55" stop-color="#1676bd"/>
      <stop offset="1" stop-color="#0c5f9d"/>
    </linearGradient>
    <linearGradient id="pixelHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#315e78" flood-opacity=".18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#315e78" flood-opacity=".2"/>
    </filter>
    <!-- An 8-bit-style chain link: square shoulders and stepped corners. -->
    <path id="pixelLink" fill-rule="evenodd" d="
      M 112,56 H 226 V 76 H 246 V 190 H 226 V 210 H 112 V 190 H 92 V 76 H 112 Z
      M 132,96 H 206 V 116 H 226 V 170 H 206 V 190 H 132 V 170 H 112 V 116 H 132 Z"/>
  </defs>

  <!-- Standalone symbol: two interlocking pixel links, not letterforms. -->
  <g filter="url(#softShadow)">
    <g transform="translate(12 5) rotate(-38 205 220)">
      <use href="#pixelLink" fill="url(#linkDeep)" stroke="#0c5f9d" stroke-width="3" stroke-linejoin="miter"/>
      <path d="M112 59 H224 V78 H244 V91 H112 Z" fill="url(#pixelHi)" opacity=".6"/>
      <path d="M102 82 H119 V184 H102 Z" fill="#ffffff" opacity=".12"/>
    </g>
    <g transform="translate(130 8) rotate(-38 205 220)">
      <use href="#pixelLink" fill="url(#linkBlue)" stroke="#315e78" stroke-width="3" stroke-linejoin="miter"/>
      <path d="M112 59 H224 V78 H244 V91 H112 Z" fill="url(#pixelHi)" opacity=".72"/>
      <path d="M102 82 H119 V184 H102 Z" fill="#ffffff" opacity=".18"/>
    </g>
  </g>

  <!-- Tiny square nodes reinforce the retro pixel language. -->
  <g filter="url(#smallShadow)">
    <rect x="382" y="96" width="18" height="18" rx="2" fill="#9fc2d8"/>
    <rect x="405" y="119" width="13" height="13" rx="1.5" fill="#568dac"/>
    <rect x="379" y="137" width="10" height="10" rx="1" fill="#1676bd"/>
  </g>

  <path d="M455 104 V365" fill="none" stroke="#9fc2d8" stroke-width="3"/>
  <text x="520" y="262" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="166" font-weight="800" letter-spacing="-5" fill="#22333d">NTO</text>
  <text x="526" y="326" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="6.5" fill="#315e78">NOSTALGIC TALK ONLINE</text>
</svg>
