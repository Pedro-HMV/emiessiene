services:
  ejabberd:
    image: ejabberd/ecs:latest
    container_name: nto-xmpp
    ports:
      - "5222:5222"   # XMPP client (STARTTLS)
      - "5223:5223"   # XMPP client (direct-TLS) — used by NTO
      - "5280:5280"   # HTTP admin panel
      - "5443:5443"   # HTTPS admin panel
    environment:
      - EJABBERD_DOMAIN=localhost
      - EJABBERD_ADMIN_USER=admin
      - EJABBERD_ADMIN_PASSWORD=admin
    volumes:
      - ./ejabberd.yml:/home/ejabberd/conf/ejabberd.yml:ro
      - ejabberd_data:/home/ejabberd/database
      - ejabberd_certs:/home/ejabberd/conf/certs

volumes:
  ejabberd_data:
  ejabberd_certs:
